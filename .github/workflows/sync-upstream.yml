name: Rebase onto upstream

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

# The built-in token cannot update workflows. Keep it read-only and use the
# repository-scoped SYNC_UPSTREAM_TOKEN only for the final push.
permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  rebase:
    if: github.repository == 'meruchan0623/archify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check sync credential
        shell: bash
        env:
          SYNC_UPSTREAM_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: |
          if [[ -z "$SYNC_UPSTREAM_TOKEN" ]]; then
            echo '::error::Set the SYNC_UPSTREAM_TOKEN repository secret to a fine-grained token for this repository with Contents and Workflows read/write permissions.'
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and rebase while preserving fork commits
        id: rebase
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git checkout -B sync-upstream refs/remotes/origin/main
          previous=$(git rev-parse HEAD)
          git remote add upstream https://github.com/tt-a1i/archify.git
          git fetch --no-tags upstream main
          upstream=$(git rev-parse refs/remotes/upstream/main)

          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo 'Fork already contains the latest upstream commit.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git rebase refs/remotes/upstream/main; then
            {
              echo '### Rebase stopped: conflicts require manual resolution'
              echo 'The remote fork has not been changed. Conflicting files:'
              git diff --name-only --diff-filter=U
            } >> "$GITHUB_STEP_SUMMARY"
            git rebase --abort
            exit 1
          fi

          # Rebuild the template from the rebased authoritative Viewer sources.
          node scripts/generate-viewer.mjs
          node scripts/generate-viewer.mjs --check
          if ! git diff --quiet -- archify/assets/template.html; then
            git add archify/assets/template.html
            git commit -m 'build: regenerate viewer after upstream rebase'
          fi
          git diff --check
          {
            echo 'changed=true'
            echo "previous=$previous"
            echo "upstream=$upstream"
          } >> "$GITHUB_OUTPUT"

      - name: Push rebased main with workflow permission
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          PREVIOUS: ${{ steps.rebase.outputs.previous }}
          UPSTREAM: ${{ steps.rebase.outputs.upstream }}
        run: |
          set -euo pipefail
          # Use a command-scoped helper: never save the token in the checkout.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push --force-with-lease="refs/heads/main:$PREVIOUS" origin HEAD:refs/heads/main
          {
            echo '### Upstream rebase completed'
            echo "Upstream: $UPSTREAM"
            echo "Fork: $(git rev-parse HEAD)"
            echo 'Custom commits were replayed. The push used an explicit lease to protect concurrent edits.'
          } >> "$GITHUB_STEP_SUMMARY"
